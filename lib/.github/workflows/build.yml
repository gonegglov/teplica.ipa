name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: |
          cd ios
          pod install
          cd ..
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 GreenhouseApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: GreenhouseApp.ipa